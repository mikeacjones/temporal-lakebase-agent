[project]
name = "lakebase-agentworkflow"
version = "0.1.0"
description = "Temporal-native agent workflow scaffold backed by Databricks Lakebase operational storage."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "temporalio>=1.18",
  "openai>=1",
  "fastapi>=0.138.1",
  "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
lakebase = [
  "databricks-sdk",
  "psycopg[binary,pool]>=3.2",
]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakebase_agentworkflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

