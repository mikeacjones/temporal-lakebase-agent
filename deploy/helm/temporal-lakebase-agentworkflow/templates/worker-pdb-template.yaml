{{- if .Values.worker.pdb.enabled }}
apiVersion: temporal.io/v1alpha1
kind: WorkerResourceTemplate
metadata:
  name: {{ include "loan-agent.workerName" . }}-pdb
  labels:
    {{- include "loan-agent.labels" . | nindent 4 }}
spec:
  workerDeploymentRef:
    name: {{ include "loan-agent.workerName" . }}
  template:
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    spec:
      minAvailable: {{ .Values.worker.pdb.minAvailable }}
      selector:
        matchLabels: {}
{{- end }}

