apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loan-agent.fullname" . }}
  labels:
    {{- include "loan-agent.labels" . | nindent 4 }}
data:
  TEMPORAL_TASK_QUEUE: {{ .Values.temporal.taskQueue | quote }}
  AGENT_MODEL_PROVIDER: {{ .Values.model.provider | quote }}
  AGENT_MODEL: {{ .Values.model.name | quote }}
  LAKEBASE_CONNECTION_MODE: {{ .Values.lakebase.connectionMode | quote }}
  LAKEBASE_ENDPOINT: {{ .Values.lakebase.endpoint | quote }}
  LAKEBASE_DATABASE: {{ .Values.lakebase.database | quote }}
  LAKEBASE_SCHEMA: {{ .Values.lakebase.schema | quote }}
  LAKEBASE_POLICY_SCHEMA: {{ .Values.lakebase.policySchema | quote }}
  LAKEBASE_POOL_SIZE: {{ .Values.lakebase.poolSize | quote }}
  LAKEBASE_MAX_OVERFLOW: {{ .Values.lakebase.maxOverflow | quote }}
  LAKEBASE_TOKEN_REFRESH_SECONDS: {{ .Values.lakebase.tokenRefreshSeconds | quote }}
  DATABRICKS_HOST: {{ .Values.databricks.host | quote }}
  DEMO_TOOL_DELAY_SECONDS: "0"
  LOG_LEVEL: "INFO"

