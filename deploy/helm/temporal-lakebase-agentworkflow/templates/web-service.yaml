apiVersion: v1
kind: Service
metadata:
  name: {{ include "loan-agent.fullname" . }}-web
  labels:
    {{- include "loan-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "loan-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP

