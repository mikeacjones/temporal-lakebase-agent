{{- if .Values.worker.autoscaling.enabled }}
apiVersion: temporal.io/v1alpha1
kind: WorkerResourceTemplate
metadata:
  name: {{ include "loan-agent.workerName" . }}-hpa
  labels:
    {{- include "loan-agent.labels" . | nindent 4 }}
spec:
  workerDeploymentRef:
    name: {{ include "loan-agent.workerName" . }}
  template:
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    spec:
      scaleTargetRef: {}
      minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
      maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
      behavior:
        scaleUp:
          stabilizationWindowSeconds: {{ .Values.worker.autoscaling.scaleUpStabilizationSeconds }}
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
            - type: Pods
              value: 4
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.worker.autoscaling.scaleDownStabilizationSeconds }}
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

