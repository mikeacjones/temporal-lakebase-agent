nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

secrets:
  # This chart only references an existing Secret; it never stores secret values.
  existingName: temporal-lakebase-agentworkflow-secrets
  keys:
    temporalApiKey: temporal-api-key
    databricksClientId: databricks-client-id
    databricksClientSecret: databricks-client-secret
    openaiApiKey: openai-api-key
    lakebasePgUrl: lakebase-pg-url

temporal:
  address: us-west-2.aws.api.temporal.io:7233
  namespace: tf-demo.zsvab
  taskQueue: lakebase-agent-task-queue
  tls: true
  connectionName: ""

databricks:
  host: https://dbc-33a81e40-df8b.cloud.databricks.com

lakebase:
  connectionMode: endpoint
  endpoint: projects/temporal-lakebase-agentworkflow/branches/production/endpoints/primary
  database: databricks_postgres
  schema: agent_ops
  policySchema: agent_policy
  poolSize: 5
  maxOverflow: 10
  tokenRefreshSeconds: 2400

model:
  provider: scripted
  name: gpt-4.1-mini

web:
  replicaCount: 2
  image:
    repository: temporal-lakebase-agentworkflow-web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  corsOrigins: ""
  terminationGracePeriodSeconds: 30
  preStopSeconds: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations: []
  affinity: {}
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 2
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
    liveness:
      periodSeconds: 15
      timeoutSeconds: 2

worker:
  replicaCount: 1
  image:
    repository: temporal-lakebase-agentworkflow-worker
    tag: latest
    pullPolicy: IfNotPresent
  defaultVersioningBehavior: PINNED
  terminationGracePeriodSeconds: 60
  rollout:
    strategy: Progressive
    steps:
      - rampPercentage: 25
        pauseDuration: 30s
      - rampPercentage: 75
        pauseDuration: 30s
      - rampPercentage: 99
        pauseDuration: 30s
  sunset:
    scaledownDelay: 2h0m0s
    deleteDelay: 48h0m0s
  concurrency:
    activityExecutorMaxWorkers: 32
    maxCachedWorkflows: 1000
    maxConcurrentWorkflowTasks: 32
    maxConcurrentActivities: 32
    maxConcurrentLocalActivities: 32
    maxConcurrentWorkflowTaskPolls: 5
    maxConcurrentActivityTaskPolls: 5
    maxActivitiesPerSecond: ""
    maxTaskQueueActivitiesPerSecond: ""
    gracefulShutdownSeconds: 30
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    scaleUpStabilizationSeconds: 60
    scaleDownStabilizationSeconds: 300
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations: []
  affinity: {}
